name: Build OpenWrt for LGU GAPM-7200U

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set swap space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ecj fakeroot g++ gawk gettext git libncurses5-dev libssl-dev python3-distutils python3-dev rsync unzip zlib1g-dev file wget

    - name: Clone OpenWrt Source & Build
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt_src
        cd openwrt_src
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        make defconfig
        make -j$(nproc) || make -j1 V=s

    - name: Upload Firmware Binaries
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-gapm7200-firmware
        path: openwrt_src/bin/targets/**/*.bin
