name: Build QWAIRAH Firmware for COMFAST CF-WA350 V2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Prepare Environment
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update && sudo apt-get install -y build-essential clang flex bison gawk gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev
    - name: Clone OpenWrt
      run: git clone --depth 1 -b openwrt-23.05 https://github.com/openwrt/openwrt.git openwrt
    - name: Feeds and Branding
      run: |
        cd openwrt
        ./scripts/feeds update -a && ./scripts/feeds install -a
        sed -i 's/OpenWrt/QWAIRAH-CF-WA350-V2/g' package/base-files/files/bin/config_generate
        git clone --depth 1 https://github.com/jerrykuku/luci-theme-argon.git package/downloads/luci-theme-argon
        mkdir -p package/downloads/luci-theme-argon/htdocs/luci-static/argon/img/ package/downloads/luci-theme-argon/htdocs/luci-static/argon/css/
        curl -s -L "https://i.ibb.co/3ykS5Q8/Picsart-26-09-14-19-24-31-395.png" -o package/downloads/luci-theme-argon/htdocs/luci-static/argon/img/qwairah-logo.png
    - name: Config Target
      run: |
        cd openwrt
        echo "CONFIG_TARGET_ath79=y" > .config
        echo "CONFIG_TARGET_ath79_generic=y" >> .config
        echo "CONFIG_TARGET_ath79_generic_DEVICE_comfast_cf-wa350-v2=y" >> .config
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        echo "CONFIG_PACKAGE_wpad-mbedtls=y" >> .config
        echo "CONFIG_PACKAGE_kmod-ath10k=y" >> .config
        echo "CONFIG_PACKAGE_ath10k-firmware-qca9888=y" >> .config
        make defconfig
        make download -j8
    - name: Compile
      run: cd openwrt && make -j$(nproc) || make -j1 V=s
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: QWAIRAH-COMFAST-CF-WA350-V2
        path: openwrt/bin/targets/ath79/generic/*.bin
